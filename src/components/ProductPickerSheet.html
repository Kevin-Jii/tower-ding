<view class="productPickerMask">
  <view class="productPickerBackdrop" catchMove @tap="emit('close')" @touchmove.stop.prevent="noopTouchMove" />
  <view class="productPickerSheet" @tap.stop @touchmove.stop>
    <view class="productPickerTitle">{{ title }}</view>
    <view class="productPickerBody">
      <view class="productPickerCategories" @touchmove.stop>
        <view
          v-for="tab in tabs"
          :key="tab.value"
          :class="['productPickerCategory', activeCategory === tab.value ? 'productPickerCategory--on' : '']"
          @tap="emit('update:activeCategory', tab.value)"
        >
          {{ tab.label }}
        </view>
      </view>
      <view class="productPickerProducts" @touchmove.stop>
        <view v-if="!products.length" class="productPickerEmpty">暂无库存商品</view>
        <view v-for="p in products" :key="p.id || p.product_id" class="productPickerItem" @tap="emit('select', p)">
          <view class="productPickerName">{{ p.product_name || `商品 #${p.product_id || ''}` }}</view>
          <view class="productPickerMeta">库存 {{ p.quantity ?? 0 }} {{ p.unit || '-' }}</view>
        </view>
      </view>
    </view>
    <view class="productPickerClose" @tap="emit('close')">关闭</view>
  </view>
</view>
